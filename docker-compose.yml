services:
  db:
    image: postgres:15-alpine
    container_name: nammastocks-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: nammastocks-backend
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/postgres
      - API_V1_PREFIX=/v1
      - PROJECT_NAME=NammaStocks Backend
      - VERSION=1.0.0
      - BACKEND_CORS_ORIGINS=["*"]
      - FINNHUB_API_KEY=${FINNHUB_API_KEY:-}
      - ALPHA_VANTAGE_API_KEY=${ALPHA_VANTAGE_API_KEY:-}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./Backend:/app
      # Shield the container's python virtualenv from host virtualenv mounts
      - /app/.venv

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: nammastocks-frontend
    environment:
      - VITE_API_URL=http://localhost:8000/v1
      - VITE_AUTH_API_URL=http://localhost:8000/api/v1
    ports:
      - "5173:5173"
    depends_on:
      - backend
    volumes:
      - ./Frontend:/app
      # Shield container's node_modules from host node_modules mounts
      - /app/node_modules

volumes:
  postgres_data:
